<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfis de Jogadores — EA FC 26</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --soft:#1c2128; --border:#30363d; --text:#f0f6fc; --muted:#8b949e; --accent:#2f81f7; --win:#3fb950; --draw:#d29922; --loss:#f85149; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,a,input { font:inherit; }
    .shell { width:min(1280px,100%); margin:auto; padding:24px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:20px; }
    .eyebrow,.muted { color:var(--muted); }
    .eyebrow { font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    h1 { margin:3px 0 0; font-size:clamp(22px,3vw,32px); }
    .nav { display:flex; gap:8px; }
    .nav a { color:var(--text); text-decoration:none; border:1px solid var(--border); border-radius:8px; padding:8px 12px; background:var(--panel); }
    .layout { display:grid; grid-template-columns:minmax(260px,340px) minmax(0,1fr); gap:18px; }
    .panel { border:1px solid var(--border); border-radius:12px; background:var(--panel); overflow:hidden; }
    .panel-head { padding:14px 16px; border-bottom:1px solid var(--border); }
    .panel-head h2 { margin:0 0 10px; font-size:16px; }
    .search { width:100%; padding:9px 11px; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:7px; outline:none; }
    .search:focus { border-color:var(--accent); }
    .player-list { max-height:calc(100vh - 190px); overflow:auto; }
    .player-item { width:100%; display:grid; gap:7px; padding:11px 16px 10px; color:inherit; text-align:left; border:0; border-bottom:1px solid var(--border); background:transparent; cursor:pointer; overflow:hidden; }
    .player-item:hover,.player-item.active { background:var(--soft); }
    .player-item.active { box-shadow:inset 3px 0 var(--accent); }
    .player-item-head,.player-item-meta { display:flex; justify-content:space-between; align-items:baseline; gap:10px; min-width:0; }
    .player-name { min-width:0; overflow:hidden; font-weight:700; text-overflow:ellipsis; white-space:nowrap; }
    .player-rating { flex:none; font-size:15px; font-variant-numeric:tabular-nums; font-weight:800; }
    .performance-track { width:100%; height:4px; overflow:hidden; border-radius:999px; background:#30363d; }
    .performance-fill { display:block; height:100%; border-radius:inherit; background:var(--muted); }
    .performance-fill.elite { background:#58a6ff; }
    .performance-fill.strong { background:#3fb950; }
    .performance-fill.good { background:#7ee787; }
    .performance-fill.regular { background:#d29922; }
    .performance-fill.low { background:#f85149; }
    .performance-fill.unrated { width:0!important; }
    .player-item-meta { color:var(--muted); font-size:11px; }
    .player-item-meta .latest { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .count { flex:none; white-space:nowrap; }
    .detail { min-height:560px; padding:20px; }
    .state { display:grid; place-items:center; min-height:500px; color:var(--muted); text-align:center; }
    .state-icon { display:block; font-size:38px; margin-bottom:8px; }
    .profile-head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; padding-bottom:18px; border-bottom:1px solid var(--border); }
    .profile-head h2 { margin:0; font-size:28px; }
    .record { display:flex; gap:8px; }
    .record span { padding:5px 9px; border-radius:999px; font-weight:700; }
    .record .WIN { color:var(--win); background:rgba(63,185,80,.12); }
    .record .DRAW { color:var(--draw); background:rgba(210,153,34,.12); }
    .record .LOSS { color:var(--loss); background:rgba(248,81,73,.12); }
    .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:18px; }
    .stat { padding:14px; border:1px solid var(--border); border-radius:9px; background:var(--soft); }
    .stat strong { display:block; font-size:24px; }
    .stat span { color:var(--muted); font-size:12px; }
    .section { margin-top:24px; }
    .section h3 { margin:0 0 12px; font-size:15px; }
    .matches { display:grid; gap:8px; }
    .match { display:grid; grid-template-columns:130px minmax(0,1fr) auto; align-items:center; gap:14px; padding:12px 14px; border:1px solid var(--border); border-radius:9px; background:var(--soft); }
    .result.WIN { color:var(--win); }.result.DRAW { color:var(--draw); }.result.LOSS { color:var(--loss); }
    .score { font-size:17px; font-weight:800; white-space:nowrap; }
    .awards { color:var(--muted); font-size:12px; margin-top:3px; }
    .error { color:var(--loss); }
    @media(max-width:850px) {
      .shell { padding:14px; }.layout { grid-template-columns:1fr; }.player-list { max-height:300px; }
      .stats { grid-template-columns:repeat(2,minmax(0,1fr)); }.match { grid-template-columns:1fr auto; }.match-date { grid-column:1/-1; }
      .profile-head { align-items:flex-start; flex-direction:column; }
    }
    @media(max-width:420px) {
      .player-item { padding-inline:13px; }
      .player-item-meta .latest { max-width:55%; }
    }
  </style>
  <link rel="stylesheet" href="/app-shell.css">
  <script src="/app-shell.js" defer></script>
</head>
<body data-app-page="players">
  <main class="shell" data-app-content>
    <header class="topbar">
      <div><div class="eyebrow">EA FC 26 — Associação BF</div><h1>Perfis de Jogadores</h1></div>
    </header>
    <div class="layout">
      <section class="panel">
        <div class="panel-head"><h2>Jogadores</h2><input id="search" class="search" type="search" placeholder="Buscar jogador…" aria-label="Buscar jogador"></div>
        <div id="player-list" class="player-list"><div class="state"><div><span class="state-icon">⏳</span>Carregando…</div></div></div>
      </section>
      <section id="profile-detail" class="panel detail state" aria-live="polite"><div><span class="state-icon">👤</span>Selecione um jogador.</div></section>
    </div>
  </main>
  <script>
    const listElement=document.getElementById('player-list'), detailElement=document.getElementById('profile-detail'), searchElement=document.getElementById('search');
    let players=[],selectedId=null;
    const profileCache=new Map();
    const escapeHtml=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
    const display=value=>value===null||value===undefined?'—':escapeHtml(value);
    const ratingNumber=value=>value===null||value===undefined||value===''?null:Number(value);
    const performanceWidth=value=>{
      const rating=ratingNumber(value);
      return rating===null||Number.isNaN(rating)?0:Math.max(0,Math.min(100,((rating-4)/6)*100));
    };
    const performanceBand=value=>{
      const rating=ratingNumber(value);
      if(rating===null||Number.isNaN(rating)) return 'unrated';
      if(rating>=8.5) return 'elite';
      if(rating>=8) return 'strong';
      if(rating>=7) return 'good';
      if(rating>=6) return 'regular';
      return 'low';
    };

    function renderPlayers() {
      const term=searchElement.value.trim().toLocaleLowerCase('pt-BR');
      const filtered=players.filter(player=>player.name.toLocaleLowerCase('pt-BR').includes(term));
      if(!filtered.length) {
        listElement.innerHTML=`<div class="state"><div><span class="state-icon">📭</span>${players.length?'Nenhum jogador encontrado.':'Nenhum perfil disponível ainda.'}</div></div>`;
        return;
      }
      listElement.innerHTML=filtered.map(player=>{
        const profile=profileCache.get(player.playerId),rating=profile?.averageRating??null,band=performanceBand(rating),width=performanceWidth(rating);
        const ratingLabel=rating===null||rating===undefined?'—':escapeHtml(rating);
        return `<button class="player-item ${player.playerId===selectedId?'active':''}" data-id="${escapeHtml(player.playerId)}"><span class="player-item-head"><span class="player-name">${escapeHtml(player.name)}</span><span class="player-rating">${ratingLabel}</span></span><span class="performance-track" role="img" aria-label="Média histórica ${ratingLabel} de 10"><span class="performance-fill ${band}" style="width:${width.toFixed(2)}%"></span></span><span class="player-item-meta"><span class="latest">${escapeHtml(player.latestMatchLabel)}</span><span class="count">${player.matchCount} partida${player.matchCount===1?'':'s'}</span></span></button>`;
      }).join('');
      listElement.querySelectorAll('.player-item').forEach(button=>button.addEventListener('click',()=>openProfile(button.dataset.id)));
    }

    async function openProfile(playerId) {
      selectedId=playerId; renderPlayers();
      detailElement.className='panel detail state';
      detailElement.innerHTML='<div><span class="state-icon">⏳</span>Carregando perfil…</div>';
      try {
        const response=await fetch(`/api/player-profiles/detail?playerId=${encodeURIComponent(playerId)}`);
        const payload=await response.json();
        if(!response.ok||payload.status!=='success') throw new Error(payload.message||'Não foi possível carregar o perfil.');
        profileCache.set(playerId,payload.profile);
        renderPlayers();
        if(selectedId===playerId) renderProfile(payload.profile);
      } catch(error) {
        detailElement.className='panel detail state error';
        detailElement.innerHTML=`<div><span class="state-icon">⚠️</span>${escapeHtml(error.message)}</div>`;
      }
    }

    function renderProfile(profile) {
      const stats=[
        ['Partidas',profile.matchCount],['Média',profile.averageRating??'—'],['Gols',profile.goals],['Assistências',profile.assists],
        ['⭐ Craques',profile.craques],['📉 Menor Desempenho',profile.bagres],['🛡️ Xerifes',profile.xerifes],['🟥 Vermelhos',profile.redCards]
      ];
      const matches=profile.recentMatches.map(match=>`<article class="match">
        <div class="match-date"><span class="result ${escapeHtml(match.outcomeCode)}">${escapeHtml(match.outcomeIcon)} ${escapeHtml(match.outcomeLabel)}</span><br><span class="muted">${escapeHtml(match.dateLabel)}</span></div>
        <div><strong>${escapeHtml(match.ourClubName)} × ${escapeHtml(match.opponentClubName)}</strong><div class="awards">Nota ${display(match.rating)} · ${display(match.goals)} G · ${display(match.assists)} A${match.awards.length?' · '+match.awards.map(escapeHtml).join(' · '):''}</div></div>
        <div class="score">${match.ourScore} × ${match.opponentScore}</div>
      </article>`).join('');
      detailElement.className='panel detail';
      detailElement.innerHTML=`<div class="profile-head"><div><div class="eyebrow">Perfil histórico</div><h2>${escapeHtml(profile.name)}</h2><div class="muted">${profile.ratedMatchCount} partida${profile.ratedMatchCount===1?'':'s'} com nota</div></div><div class="record"><span class="WIN">${profile.wins}V</span><span class="DRAW">${profile.draws}E</span><span class="LOSS">${profile.losses}D</span></div></div><div class="stats">${stats.map(([label,value])=>`<div class="stat"><strong>${display(value)}</strong><span>${escapeHtml(label)}</span></div>`).join('')}</div><section class="section"><h3>Últimas partidas</h3><div class="matches">${matches}</div></section>`;
    }

    async function hydratePlayerSummaries() {
      await Promise.all(players.map(async player=>{
        if(profileCache.has(player.playerId)) return;
        try {
          const response=await fetch(`/api/player-profiles/detail?playerId=${encodeURIComponent(player.playerId)}`),payload=await response.json();
          if(response.ok&&payload.status==='success') profileCache.set(player.playerId,payload.profile);
        } catch(_) { /* A lista continua utilizável quando um perfil isolado falha. */ }
      }));
      renderPlayers();
    }

    async function loadPlayers() {
      try {
        const response=await fetch('/api/player-profiles'),payload=await response.json();
        if(!response.ok) throw new Error('Não foi possível carregar os jogadores.');
        players=payload.players||[]; renderPlayers();
        const requested=new URLSearchParams(location.search).get('playerId');
        if(players.length) openProfile(players.some(player=>player.playerId===requested)?requested:players[0].playerId);
        else { detailElement.innerHTML='<div><span class="state-icon">🗂️</span>Os perfis aparecerão quando a primeira partida entrar para a história.</div>'; }
        void hydratePlayerSummaries();
      } catch(error) {
        listElement.innerHTML=`<div class="state error"><div><span class="state-icon">⚠️</span>${escapeHtml(error.message)}</div></div>`;
      }
    }
    searchElement.addEventListener('input',renderPlayers);
    loadPlayers();
  </script>
</body>
</html>
