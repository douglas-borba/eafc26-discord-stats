<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configuração inicial — EA FC 26</title>
  <script src="/app-shell.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #58a6ff;
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #8b949e;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    .field-group { margin-bottom: 1.25rem; }

    .field-label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: #c9d1d9;
      margin-bottom: 0.35rem;
    }

    .field-desc {
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 0.5rem;
      line-height: 1.5;
    }

    input[type="url"] {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      font-size: 0.95rem;
      padding: 0.65rem 0.85rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="url"]:focus { border-color: #58a6ff; }
    input[type="url"].field-error { border-color: #f85149; }

    .error-msg {
      font-size: 0.8rem;
      color: #f85149;
      margin-top: 0.3rem;
      display: none;
    }

    .source-msg {
      display: none;
      margin-top: 0.45rem;
      color: #8b949e;
      font-size: 0.8rem;
      line-height: 1.4;
    }

    input:disabled { opacity: 0.65; cursor: not-allowed; }

    .divider {
      border: none;
      border-top: 1px solid #21262d;
      margin: 1.5rem 0;
    }

    button {
      width: 100%;
      background: #238636;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.8rem;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) { background: #2ea043; }
    button:disabled { opacity: 0.6; cursor: default; }

    #feedback {
      margin-top: 1rem;
      font-size: 0.9rem;
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
      display: none;
    }

    #feedback.error { background: #3a1010; border: 1px solid #f85149; color: #f85149; }
    #feedback.info  { background: #0d2a1f; border: 1px solid #238636; color: #adf7b6; }

    .hint {
      margin-top: 1.5rem;
      font-size: 0.78rem;
      color: #484f58;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Configuração inicial</h1>
    <p class="subtitle">Configure o canal do Discord para que a aplicação possa publicar as partidas.</p>

    <div class="field-group">
      <label class="field-label" for="stats-input">Webhook do canal de partidas do clube</label>
      <p class="field-desc">Recebe os resumos, destaques e análises de cada partida do time.</p>
      <input
        id="stats-input"
        name="discord-match-webhook-url"
        type="url"
        placeholder="https://discord.com/api/webhooks/..."
        autocomplete="off"
        data-1p-ignore
        data-lpignore="true"
        autocorrect="off"
        spellcheck="false"
      />
      <div class="error-msg" id="stats-error"></div>
      <div class="source-msg" id="stats-source"></div>
    </div>

    <button id="save-btn" onclick="save()" disabled>Salvar e continuar</button>

    <div id="feedback"></div>

    <p class="hint">
      Quando não são controlados pelo servidor, os URLs são salvos localmente neste dispositivo.
    </p>
  </div>

  <script>
    const webhookState = { stats: { configured: false, source: 'NOT_CONFIGURED' } };

    // Load status only. Webhook secrets are never returned to or displayed by the browser.
    (async function loadSaved() {
      try {
        // Materialize the CSRF cookie before any mutation.
        await fetch('/api/health');
        const res = await fetch('/api/setup/webhook');
        if (!res.ok) return;
        const data = await res.json();
        webhookState.stats = { configured: !!data.configured, source: data.source || 'NOT_CONFIGURED' };
        applySourceState('stats', webhookState.stats);
        if (webhookState.stats.source === 'ENVIRONMENT') {
          document.getElementById('save-btn').textContent = 'Continuar';
        } else if (data.configured) {
          document.getElementById('save-btn').textContent = 'Atualizar e continuar';
        }
      } catch (e) {
        console.error('Erro ao carregar webhooks salvos:', e);
      } finally {
        document.getElementById('save-btn').disabled = false;
      }
    })();

    function applySourceState(prefix, state) {
      const input = document.getElementById(prefix + '-input');
      const message = document.getElementById(prefix + '-source');
      if (state.source === 'ENVIRONMENT') {
        input.disabled = true;
        input.placeholder = 'Configurado pelo ambiente';
        message.textContent = 'Este webhook é controlado pelas variáveis de ambiente do servidor.';
        message.style.display = 'block';
      } else if (state.source === 'STORED') {
        input.placeholder = 'Digite apenas para substituir a configuração local';
        message.textContent = 'Configurado localmente. O valor existente permanece oculto.';
        message.style.display = 'block';
      }
    }

    function clearErrors() {
      ['stats-input'].forEach(id => {
        document.getElementById(id).classList.remove('field-error');
      });
      ['stats-error'].forEach(id => {
        const el = document.getElementById(id);
        el.style.display = 'none';
        el.textContent = '';
      });
      const f = document.getElementById('feedback');
      f.style.display = 'none';
    }

    function fieldError(inputId, errorId, msg) {
      document.getElementById(inputId).classList.add('field-error');
      const el = document.getElementById(errorId);
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function save() {
      clearErrors();

      // Environment-managed secrets are already active and immutable here.
      // Continuing must not perform an unnecessary CSRF-protected mutation.
      if (webhookState.stats.source === 'ENVIRONMENT') {
        window.location.href = '/';
        return;
      }

      const statsUrl = document.getElementById('stats-input').value.trim();
      const btn = document.getElementById('save-btn');

      // Client-side presence check before sending to server
      let hasError = false;
      if (!statsUrl && !webhookState.stats.configured) {
        fieldError('stats-input', 'stats-error', 'Informe a URL do webhook do canal de estatísticas.');
        hasError = true;
      }
      if (hasError) return;

      btn.disabled = true;
      btn.textContent = 'Salvando...';

      try {
        const res = await fetch('/api/setup/webhook', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-XSRF-TOKEN': decodeURIComponent((document.cookie.match(/(?:^|; )XSRF-TOKEN=([^;]*)/) || [,''])[1]) },
          body: JSON.stringify({ webhookUrl: statsUrl }),
          redirect: 'manual'
        });

        if (res.status === 0 || res.type === 'opaqueredirect' || res.redirected || res.status === 302) {
          showInfo('Configuração salva. Redirecionando...');
          window.location.href = '/';
          return;
        }

        if (res.ok) {
          showInfo('Configuração salva. Redirecionando...');
          window.location.href = '/';
          return;
        }

        // Server-side validation errors (invalid URL format)
        const data = await res.json().catch(() => ({}));
        if (data.statsError)   fieldError('stats-input',   'stats-error',   data.statsError);
        if (!data.statsError) {
          showError(data.error || 'Erro ao salvar. Verifique os URLs e tente novamente.');
        }
      } catch (e) {
        showError('Erro de rede. Verifique a conexão.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Salvar e continuar';
      }
    }

    function showError(msg) {
      const f = document.getElementById('feedback');
      f.className = 'error';
      f.textContent = msg;
      f.style.display = 'block';
    }

    function showInfo(msg) {
      const f = document.getElementById('feedback');
      f.className = 'info';
      f.textContent = msg;
      f.style.display = 'block';
    }

    document.getElementById('stats-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') save();
    });
  </script>
</body>
</html>
