server:
  address: 127.0.0.1   # overridden at runtime by LocalConfigPostProcessor
  port: 8080
  forward-headers-strategy: framework

app:
  ea:
    platform: common-gen5
    club-id: "1104972"
    club-name: "Associação BF"
    match-type: leagueMatch   # friendlyMatch | leagueMatch | playoffMatch
    max-result-count: 20
    gateway-base-url: ${EA_GATEWAY_BASE_URL:http://127.0.0.1:8081}
    gateway-internal-token: ${EA_GATEWAY_INTERNAL_TOKEN:}

  polling:
    enabled: ${EAFC_POLLING_ENABLED:true}

  acquisition:
    enabled: ${EAFC_ACQUISITION_ENABLED:true}

  replay:
    # Omit to use the explicitly documented legacy default-club adapter.
    club-id: ${EAFC_REPLAY_CLUB_ID:}

  postgres:
    mirror-enabled: ${EAFC_POSTGRES_MIRROR_ENABLED:false}
    sync-enabled: ${EAFC_POSTGRES_SYNC_ENABLED:false}
    sync-interval-ms: ${EAFC_POSTGRES_SYNC_INTERVAL_MS:300000}

  discord:
    # Environment values take precedence over the local /setup fallback.
    match-webhook-url: ${EAFC_DISCORD_MATCH_WEBHOOK_URL:}

  llm:
    enabled: ${EAFC_LLM_ENABLED:false}
    provider: openrouter
    model: ${EAFC_LLM_MODEL:anthropic/claude-sonnet-4}
    api-key: ${EAFC_LLM_API_KEY:}
    base-url: ${EAFC_LLM_BASE_URL:https://openrouter.ai/api}
    timeout-seconds: 15
    temperature: 0.7
    max-tokens: 256

  web:
    network-enabled: false   # overridden by local config file at startup

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}

logging:
  level:
    com.eafc26: INFO
