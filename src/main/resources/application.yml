server:
  address: 127.0.0.1   # overridden at runtime by LocalConfigPostProcessor
  port: 8080
  forward-headers-strategy: framework
  reactive:
    session:
      timeout: ${EAFC_SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: lax
        secure: ${EAFC_COOKIE_SECURE:false}

app:
  security:
    viewer-password: ${EAFC_VIEWER_PASSWORD:}
    admin-password: ${EAFC_ADMIN_PASSWORD:}
  ea:
    base-url: https://proclubs.ea.com/api/fc
    platform: common-gen5
    club-id: "1104972"
    club-name: "Associação BF"
    match-type: leagueMatch   # friendlyMatch | leagueMatch | playoffMatch
    max-result-count: 20
    # EA's endpoint returns 403 without a browser-like User-Agent.
    # Verified by community projects. Change here if EA updates bot detection.
    user-agent: >-
      Mozilla/5.0 (Windows NT 10.0; Win64; x64)
      AppleWebKit/537.36 (KHTML, like Gecko)
      Chrome/124.0.0.0 Safari/537.36
    # Gateway implementation: "playwright" (default) or "webclient"
    # Playwright uses an internal headless Chromium browser to establish the
    # Akamai session without displaying or focusing a browser window.
    client: playwright
    playwright:
      headless: true
      nav-timeout-ms: 30000
      fetch-timeout-ms: 30000
      startup-retries: 1
      initial-page-url: https://proclubs.ea.com

  polling:
    enabled: true

  discord:
    # Environment values take precedence over the local /setup fallback.
    match-webhook-url: ${EAFC_DISCORD_MATCH_WEBHOOK_URL:}

  web:
    network-enabled: false   # overridden by local config file at startup

logging:
  level:
    com.eafc26: INFO
