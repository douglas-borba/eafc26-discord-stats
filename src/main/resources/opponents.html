<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Adversários — EA FC STATS</title>
  <link rel="stylesheet" href="/app-shell.css">
  <link rel="stylesheet" href="/match-summary-card.css">
  <link rel="stylesheet" href="/opponents.css">
  <script src="/app-shell.js" defer></script>
  <script src="/opponents.js" defer></script>
</head>
<body data-app-page="opponents">
<main class="opponents-page" data-app-content>
  <header class="opponents-header"><div><span class="eyebrow">Confronto por confronto</span><h1>Adversários</h1><p>O retrospecto da Associação BF contra cada clube que encontrou em campo.</p></div></header>
  <div class="opponents-layout" id="opponents-layout">
    <aside class="opponents-index" aria-label="Adversários enfrentados">
      <label class="opponent-search"><span>Buscar adversário</span><input id="opponent-search" type="search" placeholder="Nome do clube" autocomplete="off"></label>
      <div id="opponents-list" class="opponents-state">Carregando adversários…</div>
    </aside>
    <section id="opponent-detail" class="opponents-detail opponents-state" aria-live="polite">Selecione um adversário para conhecer o retrospecto.</section>
  </div>
</main>
</body>
</html>
