services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ea-fc-stats:local
    init: true
    ipc: host
    ports:
      - "8080:8080"
    environment:
      APP_WEB_NETWORK_ENABLED: "true"
      EAFC_DASHBOARD_AUTO_OPEN: "false"
    volumes:
      - eafc-data:/home/pwuser/Library/Application Support/EAFC26DiscordStats
    restart: unless-stopped

volumes:
  eafc-data:
